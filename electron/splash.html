<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DRAUN Splash</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      background-color: #EEEEEE;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 1px solid #D5D3CD;
      border-radius: 16px;
      transform: scale(1);
      opacity: 1;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s ease-out;
      will-change: transform, opacity;
    }

    body.opening {
      animation: macosWindowOpen 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    body.closing {
      transform: scale(0.94);
      opacity: 0;
    }

    .splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    .icon-wrapper {
      width: 120px;
      height: 120px;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.14), inset 0 1px 2px rgba(255, 255, 255, 0.8);
      background-color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: macosIconSpring 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .icon-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .brand-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.12em;
      color: #111111;
      text-transform: uppercase;
      margin-top: 4px;
    }

    .brand-subtitle {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.08em;
      color: #666666;
      font-family: monospace;
      margin-top: -12px;
    }

    .loading-dots {
      display: flex;
      gap: 6px;
      margin-top: 12px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: #F36F21;
      animation: pulse 1.2s infinite ease-in-out;
    }

    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    .dot:nth-child(4) { animation-delay: 0.6s; }

    @keyframes macosIconSpring {
      0% { transform: scale(0.82); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(0.6); opacity: 0.3; }
      50% { transform: scale(1.2); opacity: 1; }
    }
  </style>
</head>
<body class="opening">
  <div class="splash-container">
    <div class="icon-wrapper">
      <img src="../public/icon.png" alt="DRAUN Icon" onerror="this.src='./public/icon.png'">
    </div>
    <div class="brand-title">DRAUN</div>
    <div class="brand-subtitle">by i.am.krs</div>
    <div class="loading-dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>
</body>
</html>
